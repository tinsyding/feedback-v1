<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <script>
        (function () {
            const saved = localStorage.getItem('theme');
            const theme = (saved === 'light' || saved === 'dark')
                ? saved
                : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>管理员登录 - JF反馈系统</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-base: #09090b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --radius: 12px;
            --card-bg: rgba(24, 24, 27, 0.8);
            --card-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --input-bg: rgba(0, 0, 0, 0.2);
            --input-focus-bg: rgba(0, 0, 0, 0.4);
            --input-color: #fff;
            --btn-theme-bg: rgba(255, 255, 255, 0.06);
            --btn-theme-border: rgba(255, 255, 255, 0.12);
            --btn-theme-color: #94a3b8;
            --scrollbar-track: rgba(255, 255, 255, 0.03);
            --scrollbar-thumb: rgba(255, 255, 255, 0.16);
            --scrollbar-thumb-hover: rgba(255, 255, 255, 0.32);
        }

        [data-theme="light"] {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-base: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border-color: rgba(0, 0, 0, 0.1);
            --card-bg: rgba(255, 255, 255, 0.92);
            --card-shadow: 0 20px 45px -10px rgba(15, 23, 42, 0.12);
            --input-bg: #f1f5f9;
            --input-focus-bg: #ffffff;
            --input-color: #0f172a;
            --btn-theme-bg: rgba(0, 0, 0, 0.04);
            --btn-theme-border: rgba(0, 0, 0, 0.1);
            --btn-theme-color: #64748b;
            --scrollbar-track: rgba(0, 0, 0, 0.03);
            --scrollbar-thumb: rgba(0, 0, 0, 0.15);
            --scrollbar-thumb-hover: rgba(0, 0, 0, 0.28);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
        }

        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }

        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 4px;
            transition: background 0.2s ease;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 36px 32px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg, 12px);
            box-shadow: var(--card-shadow);
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 20px;
                border-radius: 16px;
            }
        }

        .header { 
            margin-bottom: 28px; 
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 { font-size: 1.45rem; font-weight: 700; margin: 0; color: var(--text-primary); }

        .theme-toggle-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: var(--radius);
            border: 1px solid var(--btn-theme-border);
            background: var(--btn-theme-bg);
            color: var(--btn-theme-color);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .theme-toggle-btn:hover {
            transform: translateY(-1px);
            color: var(--text-primary);
        }
        .theme-toggle-btn svg { width: 18px; height: 18px; }

        [data-theme="light"] .sun-icon { display: none; }
        [data-theme="light"] .moon-icon { display: inline-block; }
        :root:not([data-theme="light"]) .sun-icon { display: inline-block; }
        :root:not([data-theme="light"]) .moon-icon { display: none; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 8px; }
        
        input {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            color: var(--input-color);
            font-size: 1rem;
            transition: all 0.2s;
        }

        input:focus { outline: none; border-color: var(--primary); background: var(--input-focus-bg); }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .login-btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .login-btn:disabled { opacity: 0.7; cursor: not-allowed; }

        .error-msg {
            font-size: 0.85rem;
            color: #ef4444;
            margin-top: 12px;
            text-align: center;
            min-height: 20px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .error-msg.show { opacity: 1; }

        .footer {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
            text-align: center;
        }

        .back-link {
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.9rem;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .back-link:hover { color: #fff; }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="header">
            <h1>管理员登录</h1>
            <button type="button" class="theme-toggle-btn" id="theme-toggle-btn" onclick="toggleTheme()" title="切换浅色 / 深色模式" aria-label="切换浅色 / 深色模式">
                <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="username" placeholder="请输入管理员账号" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" placeholder="请输入管理员密码" required autocomplete="current-password">
            </div>
            <div id="login-error" class="error-msg"></div>
            <button type="submit" class="login-btn" id="login-btn">登录</button>
        </form>

        <div class="footer">
            <a href="index.html" class="back-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                返回主页
            </a>
        </div>
    </div>

    <script>
        const API_BASE = 'api/admin.php';

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('login-error');
            const loginBtn = document.getElementById('login-btn');

            loginBtn.disabled = true;
            loginBtn.textContent = '登录中...';
            errorEl.classList.remove('show');

            try {
                const response = await fetch(`${API_BASE}?action=login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (result.success) {
                    window.location.href = 'admin.html';
                } else {
                    errorEl.textContent = result.error || '账号或密码错误';
                    errorEl.classList.add('show');
                    loginBtn.disabled = false;
                    loginBtn.textContent = '登录';
                }
            } catch (err) {
                errorEl.textContent = '网络连接失败';
                errorEl.classList.add('show');
                loginBtn.disabled = false;
                loginBtn.textContent = '登录';
            }
        });

        // 自动检查登录状态
        (async () => {
            try {
                const response = await fetch(`${API_BASE}?action=check`);
                const result = await response.json();
                if (result.success && result.data?.loggedIn) {
                    window.location.href = 'admin.html';
                }
            } catch (err) {}
        })();

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }
        window.toggleTheme = toggleTheme;
    </script>
</body>

</html>
