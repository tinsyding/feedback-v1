# ============================================================
# 错题本反馈系统 - Nginx 站点配置（线上镜像，宝塔面板管理）
# 同步时间：2026-09-22；来源：/www/server/panel/vhost/nginx/feedback.wxjifang.cn.conf
# 注意：
# - 线上修改请直接改面板文件（已备份 .bak_20260922_2105），本文件仅作版本存档，
#   面板“网站设置”保存会重写线上文件，之后需重新回写本副本。
# - 另有面板安全的硬化片段：
#   /www/server/panel/vhost/nginx/extension/feedback.wxjifang.cn/zz-feedback-security.conf
#   （拦截 /config.json 与 *.local.php，面板升级不覆盖）。
# 站点根目录：/www/wwwroot/JF/feedback-v1（feedback 为指向它的软链接，兼容旧路径）
# 域名：feedback.wxjifang.cn / vip.wxjifang.cn / vip.jokerx.top
# ============================================================

server
{
    listen 80;
    listen 8880;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name feedback.wxjifang.cn vip.wxjifang.cn vip.jokerx.top 43.142.104.218;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/JF/feedback-git/feedback-v1;
    include /www/server/panel/vhost/nginx/extension/feedback.wxjifang.cn/*.conf;

    # 1. 证书验证目录
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/JF/feedback-git/feedback-v1;
        default_type text/plain;
        allow all;
        try_files $uri =404;
    }

    location ~ \.well-known {
        allow all;
    }

    # 2. HTTP 到 HTTPS 重定向（仅针对域名80端口，排除8880端口和直接IP访问以便测试）
    set $isRedcert 1;
    if ($server_port = 80) {
        set $isRedcert 2;
    }
    if ($host = "43.142.104.218") {
        set $isRedcert 1;
    }
    if ($uri ~ /\.well-known/) {
        set $isRedcert 1;
    }
    if ($isRedcert = 2) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }

    # 3. SSL 证书配置
    ssl_certificate    /www/server/panel/vhost/cert/feedback.tinsy.asia/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/feedback.tinsy.asia/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443";h3-Q049=":443";h3-Q048=":443"; h3-Q046=":443"; h3-Q043=":443"';
    error_page 497 https://$host$request_uri;

    # 4. PHP 8.2 FastCGI
        error_page 403 /403.html;
    error_page 404 /404.html;
    error_page 500 /500.html;
    error_page 502 /502.html;
    error_page 503 /503.html;
    error_page 504 /50x.html;
    include enable-php-82.conf;

        # 5.1 数据目录与备份安全拦截 (保留 /data/pdfs/ 供错题重练下载)
    location ^~ /data/seeds/ { return 404; }
    location ^~ /data/history/ { return 404; }
    location ^~ /data/logs/ { return 404; }
    location ^~ /data/temp/ { return 404; }
    location ^~ /data/qbank/ { return 404; }
    location ^~ /data/uploads/ { return 404; }
    location ^~ /backups/ { return 404; }
    location ^~ /tools/ { return 404; }
    location ^~ /scripts/ { return 404; }

    # 5.1.1 仅允许 /data/pdfs/*.pdf 静态下载，其余 /data/ 一律 404
    # 完整安全片段见 scripts/nginx/zz-feedback-security.conf
    location ^~ /data/pdfs/ {
        if ($uri !~* \.pdf$) { return 404; }
    }
    location ^~ /data/ { return 404; }

    # 5.0 禁止下载 nginx 等 .conf 配置文件
    location ~* \.conf$ { return 404; }

    # 5. 安全拦截敏感文件
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|phpunit\.xml|pom\.xml|build\.gradl|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$
    {
        return 404;
    }
    
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ {
        return 404;
    }

    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 404;
    }

    # 6. 静态缓存策略（保留 bfcache 可用性，同时确保每次协商验证，并继承安全头）
    location ~* \.(html|htm)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    }

    location ~* \.(gif|jpg|jpeg|png|bmp|swf|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        error_log /dev/null;
        access_log /dev/null;
    }

    access_log  /www/wwwlogs/feedback.wxjifang.cn.log;
    error_log  /www/wwwlogs/feedback.wxjifang.cn.error.log;

    # 7. VIP 路由规则
    if ($host ~* "^vip\.") {
        set $vip_allow 0;
    }
    if ($uri ~* "^/\.well-known/") {
        set $vip_allow "${vip_allow}1";
    }
    if ($host ~* "^vip\.") {
        set $is_vip 1;
    }
    if ($uri = '/') {
        set $check_root "${is_vip}root";
    }
    if ($check_root = '1root') {
        set $vip_allow "${vip_allow}1";
        rewrite ^/$ https://$host/retest.html permanent;
    }
    if ($check_root = 'root') {
        rewrite ^/$ https://$host/upload.html permanent;
    }
    if ($uri ~* "^/retest(\.html)?") {
        set $vip_allow "${vip_allow}1";
    }
    if ($uri = '/api/retest.php') {
        set $vip_allow "${vip_allow}1";
    }
    if ($uri = '/api/public_config.php') {
        set $vip_allow "${vip_allow}1";
    }
    if ($uri ~* "^/data/pdfs/.*\.pdf$") {
        set $vip_allow "${vip_allow}1";
    }
    if ($uri ~* "\.(js|css|gif|jpg|jpeg|png|bmp|swf|woff|woff2|ttf|svg|ico|json)$") {
        set $vip_allow "${vip_allow}1";
    }
    if ($uri ~* "^/(403|404|500|502|503|50x)(\.html)?$") {
        set $vip_allow "${vip_allow}1";
    }

    if ($vip_allow = "0") {
        return 404;
    }
}