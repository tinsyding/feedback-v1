# ============================================================
# feedback-v1 Go 后端 (feedback-api) Nginx 灰度反代片段
#
# 安装位置（宝塔主站）：
#   /www/server/panel/vhost/nginx/extension/<domain>/zz-feedback-go-proxy.conf
# 安装位置（非宝塔 Debian 如 jf-backup）：
#   由目标站点 vhost include 的自定义片段目录（配合 --target-dir）
#
# 安装与校验：
#   sudo bash backend-go/deploy/install_nginx_go_proxy.sh
#
# 原理说明：
#   Nginx 中精确匹配 `location = /api/...` 的优先级高于 `enable-php-82.conf` 中的
#   正则匹配 `location ~ \.php$`（与 include 顺序无关）。因此仅需挂载本片段，即可将
#   Phase 1 + Phase 2 的 6 个接口（public_config / calibrate_roi / identify /
#   upload_pdf / upload_capture / changelog）无感切流至本地 Go 服务（127.0.0.1:8090），
#   其余所有 PHP 接口与静态资源保持原样不变。
#
# 1 秒回滚 PHP：
#   删除本片段并执行 `nginx -s reload`（或执行
#   `sudo bash backend-go/deploy/install_nginx_go_proxy.sh --rollback`），
#   请求立即回退至 `enable-php-82.conf`（PHP-FPM 8.2）。
#
# 本文件由版本库维护，不要直接改线上文件。
# ============================================================

location = /api/public_config.php {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;
    client_max_body_size 15m;
}

