# ============================================================
# feedback-v1 nginx 安全硬化片段
# 安装位置：/www/server/panel/vhost/nginx/extension/<domain>/zz-feedback-security.conf
# 安装方式：sudo bash feedback-v1/scripts/install_nginx_hardening.sh
# 或在 GitHub Actions 手动运行 "Apply nginx hardening"
# 本文件由版本库维护，不要直接改线上文件。
# ============================================================

# 0. 现代安全响应头与 CSP Report-Only 观测策略
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

# 1. 禁止直读原始 config.json（防未来误写入密钥后泄露）
location = /config.json {
    return 404;
}

# 2. *.local.php（生产凭据/密钥）禁止一切 Web 访问
location ~* \.local\.php$ {
    return 404;
}

# 3. 禁止下载 nginx 等 .conf 配置文件
location ~* \.conf$ {
    return 404;
}

# 4. 仅允许 /data/pdfs/*.pdf 静态下载，其余 /data/ 一律 404
location ^~ /data/pdfs/ {
    if ($uri !~* \.pdf$) {
        return 404;
    }
}

location ^~ /data/ {
    return 404;
}
