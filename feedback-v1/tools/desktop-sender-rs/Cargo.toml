[package]
name = "desktop-sender-rs"
version = "0.2.5"
edition = "2021"
authors = ["极方教育"]
description = "极方每周作业反馈企业微信自动化发送工具 (Rust 原生重构版)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "time", "sync"] }

[target.'cfg(windows)'.dependencies]
arboard = "3.4"
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
] }
tauri = { version = "2", default-features = false, features = ["wry"] }

[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "2", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
