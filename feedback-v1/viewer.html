    <meta http-equiv="Expires" content="0">
    <title>反馈生成器 - 春秋季 - 预览</title>
    <meta name="description" content="查看春秋季学生反馈结果">
    <script>
        (function () {
            // 静态资源版本：发版修改前后端时统一 bump 此串；勿用 Date.now()（会杀死全部缓存）
            const v = '20261027-test2';
            document.write(`<link rel="stylesheet" href="css/common.css?v=${v}">`);
            document.write(`<link rel="stylesheet" href="css/viewer.css?v=${v}">`);
            document.write(`<link rel="stylesheet" href="css/auth.css?v=${v}">`);
            document.write(`<link rel="stylesheet" href="css/tokens.css?v=${v}">`);
        })();
    </script>
    <script>
        (function () {
            // 快速前置鉴权与会话检查，避免未登录或无参数时出现加载遮罩闪烁
            const params = new URLSearchParams(window.location.search);
            const sessionId = params.get('id');

            // 1. 若没有携带 id 参数，则没有任何学情数据可展示，直接判断登录并立即跳转，不加载后续任何DOM
            if (!sessionId) {
                fetch('api/auth.php?action=check')
                    .then(r => r.json())
                    .then(res => {
                        if (res && res.success && res.data && res.data.loggedIn) {
                            window.location.replace('upload.html');
                        } else {
                            window.location.replace('index.html');
                        }
                    })
                    .catch(() => {
                        window.location.replace('index.html');
                    });
                return;
            }

            // 2. 若携带了 id 参数，同样先验证登录状态，未登录立即跳转登录页
            fetch('api/auth.php?action=check')
                .then(r => r.json())
                .then(res => {
                    const loggedIn = res && res.success && res.data && res.data.loggedIn;
                    if (!loggedIn) {
                        window.location.replace('index.html');
                        return;
                    }
                    // 确认登录且有数据，允许展示遮罩
                    const screen = document.getElementById('viewer-loading-screen');
                    if (screen) {
                        screen.style.display = 'flex';
                    }
                })
                .catch(() => {});
        })();
    </script>
</head>

            </div>
            <div class="dialog-footer">
                <button class="btn secondary" id="dialog-cancel">取消</button>
                <button class="btn primary" id="dialog-confirm">确认</button>
            </div>
        </div>
    </div>

    <!-- Excluded Students Modal -->
    <div class="dialog-overlay" id="excluded-modal" onclick="if(event.target===this)this.style.display='none'">
        <div class="dialog-box" style="width: 440px; max-width: 92%;">
            <div class="dialog-header" style="display: flex; align-items: center; justify-content: space-between;">
                <h3 class="dialog-title">已排除不反馈的学生</h3>
                <button class="dialog-close-btn" onclick="document.getElementById('excluded-modal').style.display='none'" title="关闭">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 18px; height: 18px;">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="dialog-body" style="max-height: 55vh; overflow-y: auto; padding: 16px 24px;">
                <ul id="excluded-students-list" style="list-style: none; padding: 0; margin: 0;">
                </ul>
            </div>
            <div class="dialog-footer">
                <button class="btn primary" onclick="document.getElementById('excluded-modal').style.display='none'">关闭</button>
            </div>
        </div>
    </div>

    <!-- Dedicated Reminder Config Modal -->
    <div class="dialog-overlay reminder-modal-overlay" id="reminder-modal" style="display: none;" onclick="if(event.target===this)closeReminderModal()">
        <div class="dialog-box reminder-modal-box">
            <div class="reminder-modal-header">
                <div class="reminder-header-left">
                    <h3 class="reminder-modal-title" id="reminder-modal-title">作业补交提示设置</h3>
                </div>
                <button class="dialog-close-btn" onclick="closeReminderModal()" title="关闭">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 18px; height: 18px;">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="reminder-modal-body">
                <!-- Target / Missing students status card -->
                <div class="reminder-target-card" id="reminder-target-card">
                    <div class="reminder-target-header">
                        <div class="reminder-target-count-wrap">
                            <span class="reminder-target-count" id="reminder-target-count">检测中...</span>
                        </div>
                    </div>
                    <div class="reminder-names-collapse" id="reminder-names-collapse">
                        <div class="reminder-names-list" id="reminder-names-list"></div>
                    </div>
                </div>

                <!-- Quick Template Chips (Only User's Last Input) -->
                <div class="reminder-quick-section" style="display: none;">
                    <div class="reminder-quick-chips">
                        <button type="button" class="reminder-chip-btn" id="reminder-last-saved-chip" onclick="applyReminderTemplate('last')" style="display: none;">🕒 上次输入</button>
                    </div>
                </div>

                <!-- Custom Textarea -->
                <div class="reminder-input-container">
                    <div class="reminder-input-header">
                        <label for="reminder-textarea" class="reminder-input-label">提示话术内容：</label>
                        <span class="reminder-char-count" id="reminder-char-count">0 字</span>
                    </div>
                    <textarea 
                        id="reminder-textarea" 
                        class="reminder-textarea" 
                        rows="3" 
                        placeholder="请输入补交提示话术（留空并保存将清除提示）..."
                        oninput="updateReminderCharCount(this)"
                    ></textarea>
                </div>
            </div>

            <div class="reminder-modal-footer">
                <button type="button" class="reminder-btn-danger" id="reminder-clear-btn" onclick="clearCurrentReminder()" style="display: none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 14px; height: 14px;">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                    清除提示
                </button>
                <div class="reminder-footer-right">
                    <button type="button" class="btn secondary" onclick="closeReminderModal()">取消</button>
                    <button type="button" class="btn primary" id="reminder-save-btn" onclick="saveReminderModal()">保存并生效</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- SheetJS for XLSX export (本地极速加载，彻底杜绝 CDN 网络波动) -->
    <script src="js/libs/xlsx.full.min.js"></script>
    <script>
        (function () {
            // 静态资源版本：发版修改前后端时统一 bump 此串；勿用 Date.now()（会杀死全部缓存）
            const v = '20261027-test2';
            document.write(`<script src="js/logger.js?v=${v}"><\/script>`);
            document.write(`<script src="js/common.js?v=${v}"><\/script>`);
            document.write(`<script src="js/auth.js?v=${v}"><\/script>`);
            document.write(`<script src="js/viewer.js?v=${v}"><\/script>`);
        })();
    </script>
</body>

</html>
