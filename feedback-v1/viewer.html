<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>反馈生成器 - 春秋季 - 预览</title>
    <meta name="description" content="查看春秋季学生反馈结果">
    <script src="js/theme-boot.js?v=20261127-142115"></script>
    <link rel="stylesheet" href="css/common.css?v=20261127-142115">
    <link rel="stylesheet" href="css/viewer.css?v=20261127-142115">
    <link rel="stylesheet" href="css/auth.css?v=20261127-142115">
    <link rel="stylesheet" href="css/tokens.css?v=20261127-142115">
    <script src="js/viewer-boot.js?v=20261127-142115"></script>
</head>

<body class="viewer-page">
    <!-- 全局学情生成等待遮罩 (默认隐藏，仅在确认登录且有数据生成中才展示) -->
    <div id="viewer-loading-screen" style="display: none; position: fixed; inset: 0; background: var(--bg-app, #f8fafc); z-index: 99999; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.35s ease, visibility 0.35s ease;">
        <div style="background: var(--bg-surface, #ffffff); border: 1px solid var(--border-color, #e2e8f0); border-radius: 16px; padding: 36px 44px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); display: flex; flex-direction: column; align-items: center; gap: 18px; max-width: 420px; text-align: center;">
            <div style="width: 46px; height: 46px; border: 3.5px solid rgba(59, 130, 246, 0.18); border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.85s linear infinite;"></div>
            <div>
                <h3 style="margin: 0 0 6px 0; font-size: 1.15rem; font-weight: 600; color: var(--text-primary, #0f172a);">正在生成学情反馈</h3>
                <p style="margin: 0; font-size: 0.86rem; color: var(--text-secondary, #64748b); line-height: 1.6;">数据解析与反馈卡片排版中，请稍候...</p>
            </div>
        </div>
    </div>

    <div class="viewer-shell">

        <!-- Top Toolbar -->
        <nav class="viewer-toolbar">
            <div class="toolbar-left">
                <div class="nav-brand">
                    <div class="brand-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                        </svg>
                    </div>
                    <div class="brand-text">
                        <h1>教学反馈系统</h1>
                    </div>
                </div>
            </div>
            <div class="toolbar-right">
                <div class="toolbar-actions">
                    <a class="btn secondary sm" href="question-bank.html" title="错题本">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                        </svg>
                        <span>错题本</span>
                    </a>
                    <button type="button" class="btn secondary sm" data-action="global-append" title="全局追加">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span>追加</span>
                    </button>
                    <button type="button" class="btn secondary sm" id="view-excluded-btn" data-action="show-excluded" title="已排除名单">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="8.5" cy="7" r="4"></circle>
                            <line x1="18" y1="8" x2="23" y2="13"></line>
                            <line x1="23" y1="8" x2="18" y2="13"></line>
                        </svg>
                        <span>已排除名单</span>
                    </button>
                    <button type="button" class="btn secondary sm" id="split-plus-btn" data-action="split-plus" title="切分错题本与知识点" style="display:none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="6" cy="6" r="3"></circle>
                            <circle cx="6" cy="18" r="3"></circle>
                            <line x1="20" y1="4" x2="8.12" y2="15.88"></line>
                            <line x1="14.47" y1="14.48" x2="20" y2="20"></line>
                            <line x1="8.12" y1="8.12" x2="12" y2="12"></line>
                        </svg>
                        <span id="split-plus-btn-text">切分错题本</span>
                    </button>

                    <!-- Group 1: 补交提醒 -->
                    <div class="vw-dropdown" id="reminder-dropdown">
                        <button class="btn secondary sm vw-dropdown-trigger" type="button" title="补交提醒">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                                <line x1="12" y1="9" x2="12" y2="13"></line>
                                <line x1="12" y1="17" x2="12.01" y2="17"></line>
                            </svg>
                            <span>补交提醒</span>
                            <svg class="vw-dropdown-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </button>
                        <div class="vw-dropdown-menu">
                            <button type="button" class="vw-dropdown-item" id="homework-reminder-btn" data-action="zero-reminder" data-arg="homework" title="巩固补交提示">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                                    <line x1="12" y1="9" x2="12" y2="13"></line>
                                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                                </svg>
                                <span>巩固补交</span>
                            </button>
                            <button type="button" class="vw-dropdown-item" id="preview-reminder-btn" data-action="zero-reminder" data-arg="preview" title="预习补交提示">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <span>预习补交</span>
                            </button>
                            <button type="button" class="vw-dropdown-item" id="note-reminder-btn" data-action="zero-reminder" data-arg="note" title="笔记补交提示" style="display:none;">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                    <polyline points="14 2 14 8 20 8"></polyline>
                                    <line x1="16" y1="13" x2="8" y2="13"></line>
                                    <line x1="16" y1="17" x2="8" y2="17"></line>
                                </svg>
                                <span>笔记补交</span>
                            </button>
                            <button type="button" class="vw-dropdown-item" id="class-test-reminder-btn" data-action="zero-reminder" data-arg="class_test" title="课堂测试补交提示" style="display:none;">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                    <polyline points="14 2 14 8 20 8"></polyline>
                                    <line x1="9" y1="15" x2="15" y2="15"></line>
                                </svg>
                                <span>测试补交</span>
                            </button>
                        </div>
                    </div>

                    <!-- Group 2: 排名统计 -->
                    <div class="vw-dropdown" id="analytics-dropdown">
                        <button class="btn secondary sm vw-dropdown-trigger" type="button" title="排名与统计">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                            <span>排名统计</span>
                            <svg class="vw-dropdown-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </button>
                        <div class="vw-dropdown-menu">
                            <button type="button" class="vw-dropdown-item" id="homework-rank-btn" data-action="export-rank" data-arg="homework" title="巩固排名图">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                    <polyline points="21 15 16 10 5 21"></polyline>
                                </svg>
                                <span>巩固排名</span>
                            </button>
                            <button type="button" class="vw-dropdown-item" id="preview-rank-btn" data-action="export-rank" data-arg="preview" title="预习排名图" style="display:none;">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                    <polyline points="21 15 16 10 5 21"></polyline>
                                </svg>
                                <span>预习排名</span>
                            </button>
                            <button type="button" class="vw-dropdown-item" id="plus-stats-btn" data-action="export-plus-stats" title="Plus错题统计" style="display:none;">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                    <polyline points="14 2 14 8 20 8"></polyline>
                                    <line x1="16" y1="13" x2="8" y2="13"></line>
                                    <line x1="16" y1="17" x2="8" y2="17"></line>
                                    <polyline points="10 9 9 9 8 9"></polyline>
                                </svg>
                                <span>错题统计</span>
                            </button>
                            <button type="button" class="vw-dropdown-item" id="plus-pie-data-btn" data-action="export-plus-pie" title="导出饼图图片" style="display:none;">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21.21 15.89A10 10 0 1 1 8.11 2.79"></path>
                                    <path d="M22 12A10 10 0 0 0 12 2v10z"></path>
                                </svg>
                                <span>饼图图片</span>
                            </button>
                        </div>
                    </div>

                    <!-- Group 3: 导出报告 -->
                    <div class="vw-dropdown" id="export-dropdown">
                        <button class="btn secondary sm vw-dropdown-trigger" type="button" title="导出数据与文档">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                            <span>导出报告</span>
                            <svg class="vw-dropdown-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </button>
                        <div class="vw-dropdown-menu">
                            <button type="button" class="vw-dropdown-item" data-action="save-snapshot" title="保存为离线网页快照 (.html，支持企微批量发送工具直接导入)">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                                    <polyline points="17 21 17 13 7 13 7 21"></polyline>
                                    <polyline points="7 3 7 8 15 8"></polyline>
                                </svg>
                                <span>网页快照 (.html)</span>
                            </button>
                            <button type="button" class="vw-dropdown-item" data-action="export-doc" data-arg="json" title="导出 JSON (.json，企微批量发送工具格式)">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="7 10 12 15 17 10"></polyline>
                                    <line x1="12" y1="15" x2="12" y2="3"></line>
                                </svg>
                                <span>JSON 格式 (.json)</span>
                            </button>
                            <button type="button" class="vw-dropdown-item" data-action="export-doc" data-arg="xlsx" title="导出 Excel (.xlsx)">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                    <line x1="3" y1="9" x2="21" y2="9"></line>
                                    <line x1="3" y1="15" x2="21" y2="15"></line>
                                    <line x1="9" y1="3" x2="9" y2="21"></line>
                                </svg>
                                <span>Excel 表格 (.xlsx)</span>
                            </button>
                            <button type="button" class="vw-dropdown-item" data-action="export-doc" data-arg="docx" title="导出 Word (.doc)">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                    <polyline points="14 2 14 8 20 8"></polyline>
                                    <line x1="16" y1="13" x2="8" y2="13"></line>
                                    <line x1="16" y1="17" x2="8" y2="17"></line>
                                    <line x1="10" y1="9" x2="8" y2="9"></line>
                                </svg>
                                <span>Word 文档 (.doc)</span>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="toolbar-aux">
                    <div class="toolbar-divider"></div>

                    <button class="btn primary sm" id="reupload-btn" title="重新上传">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <span>重新上传</span>
                    </button>

                    <div class="theme-segmented" role="group" aria-label="主题模式">
                        <button type="button" class="theme-seg-btn" data-theme-set="light" title="浅色模式" aria-label="浅色模式" aria-pressed="false">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <circle cx="12" cy="12" r="4"></circle>
                                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                            </svg>
                        </button>
                        <button type="button" class="theme-seg-btn" data-theme-set="system" title="跟随系统" aria-label="跟随系统" aria-pressed="false">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                                <line x1="8" y1="21" x2="16" y2="21"></line>
                                <line x1="12" y1="17" x2="12" y2="21"></line>
                            </svg>
                        </button>
                        <button type="button" class="theme-seg-btn" data-theme-set="dark" title="深色模式" aria-label="深色模式" aria-pressed="false">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="viewer-content">



            <!-- Result Section -->
            <div class="result-section" id="result-section" style="display:none;">
                <div id="offline-to-online-banner-container"></div>
                <div class="result-header">
                    <div class="result-header-left">
                        <span class="result-count-badge" id="result-count">共 0 位同学</span>
                    </div>
                    <div class="header-controls">
                        <div class="ui-search">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                            <input type="text" id="search-input" placeholder="搜索姓名或学号..." aria-label="搜索姓名或学号">
                        </div>
                        <div class="sort-controls">
                            <svg class="sort-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="4" y1="6" x2="20" y2="6"></line>
                                <line x1="4" y1="12" x2="14" y2="12"></line>
                                <line x1="4" y1="18" x2="8" y2="18"></line>
                            </svg>
                            <select id="sort-field" class="sort-select" aria-label="排序方式">
                                <option value="id-asc">学号 ↑</option>
                                <option value="id-desc">学号 ↓</option>
                                <option value="score-desc">分数 ↓</option>
                                <option value="score-asc">分数 ↑</option>
                                <option value="online">线上优先</option>
                                <option value="offline">线下优先</option>
                                <option value="focus-desc">专注度 ↓</option>
                                <option value="focus-asc">专注度 ↑</option>
                                <option value="offline-focus">线下有积分优先</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="result-body" id="result-body"></div>
            </div>

            <!-- Empty State -->
            <div class="empty-state" id="empty-state">
                <div class="empty-visual">
                    <svg viewBox="0 0 120 120" fill="none">
                        <rect x="20" y="15" width="80" height="95" rx="8" stroke="currentColor" stroke-width="2"
                            opacity="0.2" />
                        <rect x="30" y="35" width="60" height="4" rx="2" fill="currentColor" opacity="0.15" />
                        <rect x="30" y="47" width="45" height="4" rx="2" fill="currentColor" opacity="0.12" />
                        <rect x="30" y="59" width="55" height="4" rx="2" fill="currentColor" opacity="0.1" />
                        <rect x="30" y="71" width="35" height="4" rx="2" fill="currentColor" opacity="0.08" />
                        <circle cx="90" cy="85" r="22" stroke="currentColor" stroke-width="2" opacity="0.15" />
                        <path d="M82 85 l8 8 l12-12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                            stroke-linejoin="round" opacity="0.3" />
                    </svg>
                </div>
                <div class="empty-text">暂无数据</div>
                <div class="empty-hint">请返回上传页面添加作业文件</div>
                <a class="empty-action-btn" href="upload.html" style="text-decoration: none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    前往上传
                </a>
            </div>
        </div>
    </div>

    <dialog class="dialog-overlay native-dialog" id="custom-dialog" closedby="any" aria-labelledby="dialog-title">
        <div class="dialog-box">
            <div class="dialog-header">
                <h3 class="dialog-title" id="dialog-title">提示</h3>
                <button type="button" class="dialog-close-btn" data-action="close-custom-dialog" title="关闭" aria-label="关闭">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 18px; height: 18px;">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="dialog-body">
                <p id="dialog-body"></p>
                <div class="dialog-input-wrap" id="dialog-input-wrap">
                    <textarea class="dialog-input" id="dialog-input" rows="3" aria-label="输入内容"></textarea>
                </div>
            </div>
            <div class="dialog-footer">
                <button type="button" class="btn secondary" id="dialog-cancel">取消</button>
                <button type="button" class="btn primary" id="dialog-confirm">确认</button>
            </div>
        </div>
    </dialog>

    <!-- Excluded Students Modal -->
    <dialog class="dialog-overlay native-dialog" id="excluded-modal" closedby="any" aria-labelledby="excluded-modal-title">
        <div class="dialog-box" style="width: 440px; max-width: 92%;">
            <div class="dialog-header" style="display: flex; align-items: center; justify-content: space-between;">
                <h3 class="dialog-title" id="excluded-modal-title">已排除不反馈的学生</h3>
                <button type="button" class="dialog-close-btn" data-action="close-excluded-modal" title="关闭" aria-label="关闭">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 18px; height: 18px;">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="dialog-body" style="max-height: 55vh; overflow-y: auto; padding: 16px 24px;">
                <ul id="excluded-students-list" style="list-style: none; padding: 0; margin: 0;">
                </ul>
            </div>
            <div class="dialog-footer">
                <button type="button" class="btn primary" data-action="close-excluded-modal">关闭</button>
            </div>
        </div>
    </dialog>

    <!-- Dedicated Reminder Config Modal -->
    <dialog class="dialog-overlay reminder-modal-overlay native-dialog" id="reminder-modal" closedby="any">
        <div class="dialog-box reminder-modal-box">
            <div class="reminder-modal-header">
                <div class="reminder-header-left">
                    <h3 class="reminder-modal-title" id="reminder-modal-title">作业补交提示设置</h3>
                </div>
                <button type="button" class="dialog-close-btn" data-action="close-reminder-modal" title="关闭" aria-label="关闭">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 18px; height: 18px;">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="reminder-modal-body">
                <!-- Target / Missing students status card -->
                <div class="reminder-target-card" id="reminder-target-card">
                    <div class="reminder-target-header">
                        <div class="reminder-target-count-wrap">
                            <span class="reminder-target-count" id="reminder-target-count">检测中...</span>
                        </div>
                    </div>
                    <div class="reminder-names-collapse" id="reminder-names-collapse">
                        <div class="reminder-names-list" id="reminder-names-list"></div>
                    </div>
                </div>

                <!-- Quick Template Chips (Only User's Last Input) -->
                <div class="reminder-quick-section" style="display: none;">
                    <div class="reminder-quick-chips">
                        <button type="button" class="reminder-chip-btn" id="reminder-last-saved-chip" data-action="reminder-template" data-arg="last" style="display: none;">上次输入</button>
                    </div>
                </div>

                <!-- Custom Textarea -->
                <div class="reminder-input-container">
                    <div class="reminder-input-header">
                        <label for="reminder-textarea" class="reminder-input-label">提示话术内容：</label>
                        <span class="reminder-char-count" id="reminder-char-count">0 字</span>
                    </div>
                    <textarea 
                        id="reminder-textarea" 
                        class="reminder-textarea" 
                        rows="3" 
                        placeholder="请输入补交提示话术（留空并保存将清除提示）..."
                    ></textarea>
                </div>
            </div>

            <div class="reminder-modal-footer">
                <button type="button" class="reminder-btn-danger" id="reminder-clear-btn" data-action="clear-reminder" style="display: none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 14px; height: 14px;">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                    清除提示
                </button>
                <div class="reminder-footer-right">
                    <button type="button" class="btn secondary" data-action="close-reminder-modal">取消</button>
                    <button type="button" class="btn primary" id="reminder-save-btn" data-action="save-reminder">保存并生效</button>
                </div>
            </div>
        </div>
    </dialog>

    <div class="toast-container" id="toast-container" popover="manual"></div>

    <!-- SheetJS for XLSX export (本地极速加载，彻底杜绝 CDN 网络波动) -->
    <script defer src="js/libs/xlsx.full.min.js"></script>
    <script defer src="js/logger.js?v=20261127-142115"></script>
    <script defer src="js/common.js?v=20261127-142115"></script>
    <script defer src="js/auth.js?v=20261127-142115"></script>
    <script defer src="js/viewer.js?v=20261127-142115"></script>
</body>

</html>
