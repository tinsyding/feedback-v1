    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d1117;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        .page-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .bg-stars {
            position: absolute;
            inset: -40px;
            width: calc(100% + 80px);
            height: calc(100% + 80px);
            background: radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.08) 0%, transparent 65%);
            z-index: 1;
            will-change: transform;
            transition: transform 0.1s ease-out;
            pointer-events: none;
        }

        .scene-container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            will-change: transform;
            transition: transform 0.1s ease-out;
        }

        .scene-img {
            width: 100%;
            height: auto;
            max-height: 70vh;
            display: block;
            filter: drop-shadow(0 20px 35px rgba(0, 0, 0, 0.3));
            pointer-events: none;
        }

        .error-meta {
            margin-top: 18px;
            text-align: center;
            color: rgba(255, 255, 255, 0.85);
        }

        .error-title {
            font-size: clamp(22px, 3.5vw, 32px);
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .error-subtitle {
            font-size: clamp(13px, 1.8vw, 15px);
            color: rgba(255, 255, 255, 0.6);
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        @media (max-width: 768px) {
            .scene-container {
                max-width: 94%;
            }
        }
    </style>
</head>

    <script>
        (function () {
            const bgLayer = document.getElementById('bgLayer');
            const sceneContainer = document.getElementById('sceneContainer');

            let mouseX = 0, mouseY = 0;
            let currentX = 0, currentY = 0;
            let reqId = null;

            function onMouseMove(e) {
                const halfW = window.innerWidth / 2;
                const halfH = window.innerHeight / 2;
                mouseX = (e.clientX - halfW) / halfW;
                mouseY = (e.clientY - halfH) / halfH;
                if (!reqId) {
                    reqId = requestAnimationFrame(updateParallax);
                }
            }

            function updateParallax() {
                currentX += (mouseX - currentX) * 0.08;
                currentY += (mouseY - currentY) * 0.08;

                if (bgLayer) {
                    bgLayer.style.transform = `translate3d(${currentX * 14}px, ${currentY * 10}px, 0)`;
                }
                if (sceneContainer) {
                    sceneContainer.style.transform = `translate3d(${currentX * -24}px, ${currentY * -16}px, 0)`;
                }

                if (Math.abs(mouseX - currentX) > 0.001 || Math.abs(mouseY - currentY) > 0.001) {
                    reqId = requestAnimationFrame(updateParallax);
                } else {
                    reqId = null;
                }
            }

            window.addEventListener('mousemove', onMouseMove, { passive: true });

            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', function(e) {
                    if (e.gamma !== null && e.beta !== null) {
                        mouseX = Math.min(Math.max(e.gamma / 30, -1), 1);
                        mouseY = Math.min(Math.max((e.beta - 45) / 30, -1), 1);
                        if (!reqId) {
                            reqId = requestAnimationFrame(updateParallax);
                        }
                    }
                }, { passive: true });
            }
        })();
    </script>
