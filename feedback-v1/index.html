<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <script>
        (function () {
            const saved = localStorage.getItem('theme');
            const theme = (saved === 'light' || saved === 'dark')
                ? saved
                : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="theme-color" content="#09090b">
    <title>登录 - 教学反馈系统</title>
    <meta name="description" content="教师端安全登录">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-glow: rgba(37, 99, 235, 0.25);
            --bg-base: #09090b;
            --bg-card: rgba(24, 24, 27, 0.78);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-focus: #2563eb;
            --input-bg: rgba(10, 10, 12, 0.55);
            --input-bg-hover: rgba(10, 10, 12, 0.75);
            --input-bg-focus: rgba(12, 12, 16, 0.85);
            --input-color: #ffffff;
            --input-placeholder: #52525b;
            --input-border-hover: rgba(255, 255, 255, 0.16);
            --card-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.03);
            --btn-theme-bg: rgba(255, 255, 255, 0.06);
            --btn-theme-border: rgba(255, 255, 255, 0.12);
            --btn-theme-color: #94a3b8;
            --btn-theme-hover-bg: rgba(255, 255, 255, 0.12);
            --btn-theme-hover-color: #f8fafc;
            --bg-gradient-1: rgba(37, 99, 235, 0.16);
            --bg-gradient-2: rgba(56, 189, 248, 0.06);
            --error-bg: rgba(239, 68, 68, 0.1);
            --error-border: rgba(239, 68, 68, 0.3);
            --error-text: #f87171;
            --radius-md: 8px;
            --radius-lg: 12px;
            --scrollbar-track: rgba(255, 255, 255, 0.03);
            --scrollbar-thumb: rgba(255, 255, 255, 0.16);
            --scrollbar-thumb-hover: rgba(255, 255, 255, 0.32);
        }

        [data-theme="light"] {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-glow: rgba(37, 99, 235, 0.2);
            --bg-base: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.92);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-subtle: rgba(0, 0, 0, 0.08);
            --border-focus: #2563eb;
            --input-bg: #f1f5f9;
            --input-bg-hover: #ffffff;
            --input-bg-focus: #ffffff;
            --input-color: #0f172a;
            --input-placeholder: #94a3b8;
            --input-border-hover: rgba(0, 0, 0, 0.2);
            --card-shadow: 0 20px 45px -10px rgba(15, 23, 42, 0.1), 0 0 0 1px rgba(0, 0, 0, 0.04);
            --btn-theme-bg: rgba(0, 0, 0, 0.04);
            --btn-theme-border: rgba(0, 0, 0, 0.1);
            --btn-theme-color: #64748b;
            --btn-theme-hover-bg: rgba(0, 0, 0, 0.08);
            --btn-theme-hover-color: #0f172a;
            --bg-gradient-1: rgba(99, 102, 241, 0.10);
            --bg-gradient-2: rgba(14, 165, 233, 0.08);
            --error-bg: #fef2f2;
            --error-border: #fecaca;
            --error-text: #dc2626;
            --scrollbar-track: rgba(0, 0, 0, 0.03);
            --scrollbar-thumb: rgba(0, 0, 0, 0.15);
            --scrollbar-thumb-hover: rgba(0, 0, 0, 0.28);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
        }

        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }

        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 4px;
            transition: background 0.2s ease;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .login-wrapper {
            width: 100%;
            max-width: 380px;
            position: relative;
            z-index: 1;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 34px 30px 32px;
            box-shadow: var(--card-shadow);
            transition: box-shadow 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
        }

        @media (max-width: 440px) {
            .login-card {
                padding: 28px 20px 26px;
                border-radius: 14px;
            }
        }

        .login-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .login-title {
            font-size: 1.45rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .theme-toggle-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: var(--radius-md);
            border: 1px solid var(--btn-theme-border);
            background: var(--btn-theme-bg);
            color: var(--btn-theme-color);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .theme-toggle-btn:hover {
            background: var(--btn-theme-hover-bg);
            color: var(--btn-theme-hover-color);
            transform: translateY(-1px);
        }

        .theme-toggle-btn svg {
            width: 19px;
            height: 19px;
        }

        /* 浅色与暗色模式下太阳/月亮图标展示规则 */
        [data-theme="light"] .sun-icon { display: none; }
        [data-theme="light"] .moon-icon { display: inline-block; }
        :root:not([data-theme="light"]) .sun-icon { display: inline-block; }
        :root:not([data-theme="light"]) .moon-icon { display: none; }

        .form-group {
            margin-bottom: 18px;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            pointer-events: none;
            transition: color 0.2s;
        }

        .form-input {
            width: 100%;
            height: 46px;
            padding: 0 14px 0 42px;
            background: var(--input-bg);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            color: var(--input-color);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s, box-shadow 0.2s, color 0.2s;
        }

        .form-input::placeholder {
            color: var(--input-placeholder);
            font-size: 0.92rem;
        }

        .form-input:hover {
            border-color: var(--input-border-hover);
            background: var(--input-bg-hover);
        }

        .form-input:focus {
            border-color: var(--border-focus);
            background: var(--input-bg-focus);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .form-input:focus + .input-icon,
        .input-wrap:focus-within .input-icon {
            color: var(--border-focus);
        }

        .pwd-toggle-btn {
            position: absolute;
            right: 12px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: color 0.2s;
        }

        .pwd-toggle-btn:hover {
            color: var(--text-secondary);
        }

        /* 验证码样式 */
        .captcha-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .captcha-wrap {
            flex: 1;
            min-width: 0;
        }

        .captcha-img-box {
            position: relative;
            width: 126px;
            height: 46px;
            flex-shrink: 0;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border-subtle);
            background: var(--input-bg);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s, opacity 0.2s;
            user-select: none;
        }

        .captcha-img-box:hover {
            border-color: var(--border-focus);
        }

        .captcha-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .captcha-reload-ico {
            position: absolute;
            right: 6px;
            bottom: 6px;
            width: 16px;
            height: 16px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            padding: 2px;
            color: #fff;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .captcha-img-box:hover .captcha-reload-ico {
            opacity: 0.85;
        }

        /* 错误提示 */
        .error-alert {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            border-radius: var(--radius-md);
            color: var(--error-text);
            font-size: 0.86rem;
            margin-bottom: 18px;
            animation: fadeIn 0.2s ease-out;
        }

        .error-alert.show {
            display: flex;
        }

        .error-alert svg {
            flex-shrink: 0;
            width: 16px;
            height: 16px;
        }

        /* 登录按钮 */
        .submit-btn {
            width: 100%;
            height: 44px;
            background: var(--primary, #2563eb);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-md);
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 500;
            font-family: inherit;
            letter-spacing: 0.02em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.15s ease, opacity 0.15s ease;
            box-shadow: none;
            margin-top: 6px;
        }

        .submit-btn:hover:not(:disabled) {
            background: var(--primary-hover, #1d4ed8);
        }

        .submit-btn:active:not(:disabled) {
            transform: scale(0.99);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* 按钮加载圈 */
        .btn-spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        /* 动画 */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .shake {
            animation: shake 0.35s ease-in-out;
        }

        .slide-down {
            animation: fadeIn 0.25s ease-out;
        }
    </style>
</head>

<body>
    <div class="login-wrapper">
        <div class="login-card" id="login-card">
            <div class="login-header">
                <h1 class="login-title">登录</h1>
                <button type="button" class="theme-toggle-btn" id="theme-toggle-btn" onclick="toggleTheme()" title="切换浅色 / 深色模式" aria-label="切换浅色 / 深色模式">
                    <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>

            <form id="login-form" onsubmit="handleLoginSubmit(event)" novalidate>
                <!-- 账号输入 -->
                <div class="form-group">
                    <div class="input-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input type="text" id="username" class="form-input" placeholder="账号" autocomplete="username" required autofocus>
                    </div>
                </div>

                <!-- 密码输入 -->
                <div class="form-group">
                    <div class="input-wrap">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="password" class="form-input" placeholder="密码" autocomplete="current-password" required style="padding-right: 40px;">
                        <button type="button" class="pwd-toggle-btn" onclick="togglePasswordVisibility()" title="显示/隐藏密码">
                            <svg id="pwd-eye-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- 图形验证码（首次输错后展示） -->
                <div class="form-group slide-down" id="captcha-group" style="display: none;">
                    <div class="captcha-row">
                        <div class="input-wrap captcha-wrap">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                            </svg>
                            <input type="text" id="captcha" class="form-input" placeholder="验证码" maxlength="4" autocomplete="off">
                        </div>
                        <div class="captcha-img-box" onclick="refreshCaptcha()" title="看不清？点击更换验证码">
                            <img id="captcha-img" src="" alt="验证码">
                            <svg class="captcha-reload-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                <path d="M23 4v6h-6"></path>
                                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- 错误提示栏 -->
                <div class="error-alert" id="error-alert">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span id="error-text">账号或密码错误</span>
                </div>

                <!-- 登录提交按钮 -->
                <button type="submit" id="submit-btn" class="submit-btn">
                    <span>登录</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        const AUTH_API = 'api/auth.php';
        let isCaptchaRequired = false;

        // 页面初始化：校验是否已登录，已登录直接跳反馈页
        (async function initLoginState() {
            try {
                const res = await fetch(`${AUTH_API}?action=check`);
                const json = await res.json();
                if (json.success && json.data) {
                    if (json.data.loggedIn) {
                        window.location.replace('upload.html');
                        return;
                    }
                    if (json.data.require_captcha) {
                        showCaptchaField();
                    }
                }
            } catch (e) {
                // 忽略网络初始校验异常
            }
        })();

        // 浅色 / 深色模式切换
        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            const metaThemeColor = document.querySelector('meta[name="theme-color"]');
            if (metaThemeColor) {
                metaThemeColor.setAttribute('content', newTheme === 'light' ? '#f8fafc' : '#09090b');
            }
        }
        window.toggleTheme = toggleTheme;

        // 切换密码明暗文显示
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('pwd-eye-icon');
            if (!pwdInput) return;
            const isText = pwdInput.type === 'text';
            pwdInput.type = isText ? 'password' : 'text';
            if (eyeIcon) {
                eyeIcon.innerHTML = isText 
                    ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>'
                    : '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            }
        }

        // 动态展示验证码行并刷新验证码图片
        function showCaptchaField() {
            isCaptchaRequired = true;
            const group = document.getElementById('captcha-group');
            if (group) {
                group.style.display = 'block';
            }
            refreshCaptcha();
        }

        // 刷新图形验证码
        function refreshCaptcha() {
            const img = document.getElementById('captcha-img');
            const input = document.getElementById('captcha');
            if (img) {
                img.src = `${AUTH_API}?action=captcha&t=${Date.now()}`;
            }
            if (input) {
                input.value = '';
            }
        }

        // 显示错误提示并伴随卡片微震反馈
        function showError(msg) {
            const alertEl = document.getElementById('error-alert');
            const textEl = document.getElementById('error-text');
            const card = document.getElementById('login-card');
            if (textEl) textEl.textContent = msg || '登录失败，请重试';
            if (alertEl) alertEl.classList.add('show');
            if (card) {
                card.classList.remove('shake');
                void card.offsetWidth; // 触发重绘
                card.classList.add('shake');
            }
        }

        function hideError() {
            const alertEl = document.getElementById('error-alert');
            if (alertEl) alertEl.classList.remove('show');
        }

        // 表单提交处理
        async function handleLoginSubmit(e) {
            e.preventDefault();
            hideError();

            const username = document.getElementById('username')?.value.trim() || '';
            const password = document.getElementById('password')?.value.trim() || '';
            const captchaInput = document.getElementById('captcha');
            const captcha = captchaInput ? captchaInput.value.trim() : '';
            const submitBtn = document.getElementById('submit-btn');

            if (!username) {
                showError('请输入账号');
                document.getElementById('username')?.focus();
                return;
            }

            if (!password) {
                showError('请输入密码');
                document.getElementById('password')?.focus();
                return;
            }

            if (isCaptchaRequired && !captcha) {
                showError('请输入图形验证码');
                captchaInput?.focus();
                return;
            }

            // 禁用按钮并显示加载动画
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="btn-spinner"></span><span>登录中...</span>';
            }

            try {
                const payload = { username, password };
                if (isCaptchaRequired) {
                    payload.captcha = captcha;
                }

                const res = await fetch(`${AUTH_API}?action=login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const json = await res.json();

                if (json.success) {
                    if (submitBtn) {
                        submitBtn.innerHTML = '<span>登录成功</span>';
                    }
                    // 平滑跳转至反馈生成页面
                    window.location.replace('upload.html');
                } else {
                    // 输错：检查是否触发验证码机制
                    if (json.data && json.data.require_captcha) {
                        showCaptchaField();
                    } else if (isCaptchaRequired) {
                        refreshCaptcha();
                    }
                    showError(json.error || '账号或密码错误');

                    if (isCaptchaRequired && captchaInput) {
                        captchaInput.focus();
                    } else {
                        document.getElementById('password')?.select();
                    }

                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<span>登 录</span>';
                    }
                }
            } catch (err) {
                showError('网络请求异常，请检查连接');
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>登 录</span>';
                }
            }
        }
    </script>
</body>
