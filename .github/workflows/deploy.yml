name: Deploy to production

# main 分支每次 push 自动部署到宝塔生产机。
# 所需 Secrets（仓库 Settings → Secrets and variables → Actions → New repository secret）：
#   DEPLOY_HOST     服务器 IP（当前 106.14.62.196）
#   DEPLOY_PORT     SSH 端口（当前 28964）
#   DEPLOY_USER     SSH 用户（当前 root）
#   DEPLOY_SSH_KEY  私钥内容（id_github_actions，含 BEGIN/END 行）

on:
  push:
    branches: [main]
    # 纯文档 / CI 配置 / 仓库杂项改动不触发生产部署，节省 Actions 分钟数。
    # 注意：只要一次 push 里包含任意业务文件（feedback-v1/**），仍会正常部署。
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/**'
      - '.gitignore'
      - '.gitattributes'
      - '_scan.py'

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Preflight check secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=""
          [ -z "$DEPLOY_HOST" ] && missing="$missing DEPLOY_HOST"
          [ -z "$DEPLOY_PORT" ] && missing="$missing DEPLOY_PORT"
          [ -z "$DEPLOY_USER" ] && missing="$missing DEPLOY_USER"
          [ -z "$DEPLOY_SSH_KEY" ] && missing="$missing DEPLOY_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "缺少 Secrets:$missing"
            echo "请到仓库 Settings → Secrets and variables → Actions → New repository secret 添加，名字必须完全一致（含下划线，区分大小写）。"
            exit 1
          fi
          echo "secrets OK"
          if ! echo "$DEPLOY_PORT" | grep -Eq '^[0-9]+$'; then
            echo "DEPLOY_PORT 必须是纯数字端口，当前值非法。"
            exit 1
          fi

      - name: Set up SSH key
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Pull latest code on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 $DEPLOY_USER@$DEPLOY_HOST"
          # 1. 临时解除 .user.ini 宝塔防跨目录不可变保护 (+i)，避免阻止 git 检出与 chown/chmod
          $SSH "find /www/wwwroot/JF/feedback-git -name '.user.ini' -exec chattr -i {} + 2>/dev/null || true"
          # 2. 拉取最新代码并严格对齐当前目标提交（彻底避免多分支 fast-forward 失败与服务端临时改动冲突）
          $SSH "cd /www/wwwroot/JF/feedback-git && git fetch origin main && git reset --hard $TARGET_SHA && git rev-parse HEAD"
          # 3. 统一属主与权限（pull/reset 以 root 执行，新文件交还 www 属主并规范读写位）
          $SSH "chown -R www:www /www/wwwroot/JF/feedback-git && cd /www/wwwroot/JF/feedback-git && find feedback-v1 -type d -exec chmod 755 {} + && find feedback-v1 -type f -exec chmod 644 {} + && chmod 700 .git && echo PERMS-OK"
          # 4. 重新加锁 .user.ini 恢复宝塔目录安全防御
          $SSH "find /www/wwwroot/JF/feedback-git -name '.user.ini' -exec chattr +i {} + 2>/dev/null || true"

      - name: Reload PHP-FPM (clear opcache)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 $DEPLOY_USER@$DEPLOY_HOST"
          # PHP opcache 可能继续提供旧代码，pull 后必须 reload 才会生效
          $SSH "if [ -x /etc/init.d/php-fpm-82 ]; then /etc/init.d/php-fpm-82 reload; else systemctl reload php-fpm-82; fi"

      - name: Smoke test
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 $DEPLOY_USER@$DEPLOY_HOST"
          # 1. 线上代码版本必须等于本次推送的提交
          REMOTE_SHA=$($SSH "git -C /www/wwwroot/JF/feedback-git rev-parse HEAD")
          if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
            echo "version mismatch: server=$REMOTE_SHA expected=$GITHUB_SHA"
            exit 1
          fi
          echo "version OK: $REMOTE_SHA"
          # 2. 关键页面与接口必须 200
          check() {
            code=$(curl -4 -sk --retry 3 --retry-delay 2 --retry-connrefused --connect-timeout 10 -m 30 -o /dev/null -w "%{http_code}" "$1")
            if [ "$code" = "200" ]; then echo "PASS $1"; else echo "FAIL $1 => $code"; exit 1; fi
          }
          check "https://feedback.wxjifang.cn/upload.html"
          check "https://feedback.wxjifang.cn/viewer.html"
          check "https://feedback.wxjifang.cn/question-bank.html"
          check "https://feedback.wxjifang.cn/admin.html"
          check "https://feedback.wxjifang.cn/api/auth.php?action=check"
          check "https://feedback.wxjifang.cn/api/public_config.php"
          check "https://feedback.wxjifang.cn/api/calibrate_roi.php"
          check "https://feedback.wxjifang.cn/css/tokens.css"
          check "https://feedback.wxjifang.cn/js/upload.js"
          check "https://vip.wxjifang.cn/retest.html"
