name: Build Rust 极方反馈工具 (Fluent 桌面版)

on:
  workflow_dispatch:
  push:
    paths:
      - 'feedback-v1/tools/desktop-sender-rs/**'
      - '.github/workflows/build-tools-rs.yml'

jobs:
  build:
    name: Build Windows x64 Native Exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cargo Test
        working-directory: feedback-v1/tools/desktop-sender-rs
        run: cargo test

      - name: Build Release Binary
        working-directory: feedback-v1/tools/desktop-sender-rs
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Verify & Report Size
        run: |
          Get-Item feedback-v1/tools/desktop-sender-rs/target/x86_64-pc-windows-msvc/release/desktop-sender-rs.exe | Select-Object Name, Length

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-sender-rs-windows-x64
          path: feedback-v1/tools/desktop-sender-rs/target/x86_64-pc-windows-msvc/release/desktop-sender-rs.exe
