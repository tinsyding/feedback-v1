name: Build 反馈工具

# 用法：git tag tools-v1.0 && git push origin tools-v1.0
# 自动在 Windows 云端构建 exe 并挂到同名 Release 下，附件名为 极方每周反馈程序-v1.0.exe。
# 构建参数与本地完全一致（复用 send_feedback.spec + requirements.txt 锁定版本）。

on:
  push:
    tags:
      - 'tools-*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: feedback-v1/tools/desktop-sender/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r feedback-v1/tools/desktop-sender/requirements.txt

      - name: Build exe
        working-directory: feedback-v1/tools/desktop-sender
        run: python -m PyInstaller --noconfirm --clean send_feedback.spec

      - name: Rename asset
        run: |
          VER="${GITHUB_REF_NAME#tools-}"
          cp "feedback-v1/tools/desktop-sender/dist/极方每周反馈程序.exe" "极方每周反馈程序-${VER}.exe"
          ls -la 极方每周反馈程序-*.exe

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#tools-}"
          NOTES="自动构建（${GITHUB_SHA:0:7}）。双击即用，无需 Python；首次启动稍慢属正常；建议单独建文件夹存放运行。"
          gh release create "$GITHUB_REF_NAME" "极方每周反馈程序-${VER}.exe" --title "极方每周反馈程序 ${VER}" --notes "$NOTES" \
            || gh release upload "$GITHUB_REF_NAME" "极方每周反馈程序-${VER}.exe" --clobber
