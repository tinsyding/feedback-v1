name: Build 反馈工具

# 用法：git tag tools-v1.4 && git push origin tools-v1.4
# 自动在 Windows 云端构建 exe 并挂到同名 Release 下，附件名为 极方每周反馈程序-v1.4.exe。
# 构建参数与本地完全一致（复用 send_feedback.spec + requirements.txt 锁定版本）。

on:
  push:
    tags:
      - 'tools-*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: feedback-v1/tools/desktop-sender/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r feedback-v1/tools/desktop-sender/requirements.txt

      - name: Build exe
        working-directory: feedback-v1/tools/desktop-sender
        run: python -m PyInstaller --noconfirm --clean send_feedback.spec

      - name: Extract version
        id: get_version
        run: |
          VER="${GITHUB_REF_NAME#tools-}"
          echo "version=${VER}" >> $GITHUB_OUTPUT

      - name: Rename asset
        run: |
          VER="${{ steps.get_version.outputs.version }}"
          cp "feedback-v1/tools/desktop-sender/dist/极方每周反馈程序.exe" "极方每周反馈程序-${VER}.exe"
          ls -la 极方每周反馈程序-*.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/tools-')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: 极方每周反馈程序 ${{ steps.get_version.outputs.version }}
          body: |
            自动构建（${{ github.sha }}）。双击即用，无需 Python；首次启动稍慢属正常；建议单独建文件夹存放运行。
          files: |
            极方每周反馈程序-*.exe
