name: Build 反馈工具

# 用法：git tag tools-v2.0 && git push origin tools-v2.0
# 自动在 Windows 云端构建产物并挂到同名 Release 下，附件名为 极方每周反馈程序-v2.0.zip。
#
# 反误报打包策略（详见 feedback-v1/tools/desktop-sender/README.md 第八章）：
#   1) onedir + zip 分发：不再把 90MB 自解压到 %TEMP%\_MEIxxxxx，也不再派生子进程，
#      这两项是 PyInstaller onefile 被启发式引擎锁定的核心行为特征；
#   2) 关闭 UPX 二次加壳（UPX 段头是教科书式识别特征）；
#   3) 剔除全项目零引用的 opencv-python 及其传递依赖（体积 91MB -> 约 40MB 量级）；
#   4) 写入带中文厂商/产品信息的 VERSIONINFO 资源块（version_info.txt）；
#   5) 【可选】Authenticode 代码签名 —— 见下方 SIGN_STEP，
#      未配置证书时自动跳过，不阻断构建。

on:
  workflow_dispatch:
  push:
    tags:
      - 'tools-*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: feedback-v1/tools/desktop-sender/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r feedback-v1/tools/desktop-sender/requirements.txt

      - name: Build (Classic)
        working-directory: feedback-v1/tools/desktop-sender
        run: |
          # spec 中已在 EXE 与 COLLECT 阶段均硬编码配置 upx=False，关闭加壳防杀软误报。
          python -m PyInstaller --noconfirm --clean send_feedback.spec

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Rust Native (Fluent)
        working-directory: feedback-v1/tools/desktop-sender-rs
        run: |
          cargo build --release --target x86_64-pc-windows-msvc
          mkdir -p ../desktop-sender/dist
          cp target/x86_64-pc-windows-msvc/release/desktop-sender-rs.exe ../desktop-sender/dist/极方每周反馈程序-Fluent-x64.exe

      # ---------------------------------------------------------------------
      # 可选代码签名步骤。
      #
      # 无签名程序的信誉分从发布第一天就是 0，所有启发式规则全都会命中，
      # 因此签名是压制误报最直接、也最彻底的一招。
      #
      # 启用方式（无需改动本文件）：
      #   Settings -> Secrets and variables -> Actions
      #   Variables 标签页新增 WIN_CERT_NAME = 证书主体名（如「极方教育」）
      #   Secrets  标签页新增
      #     WIN_CERT_PFX      base64 编码的 .pfx（注意是 base64 文本，不是二进制）
      #     WIN_CERT_PASSWORD pfx 解锁口令
      # 未设置 WIN_CERT_NAME 时，本步骤自动跳过，不阻断构建。
      # ---------------------------------------------------------------------
      - name: Sign (optional)
        if: ${{ vars.WIN_CERT_NAME != '' }}
        env:
          WIN_CERT_NAME: ${{ vars.WIN_CERT_NAME }}
          WIN_CERT_PFX: ${{ secrets.WIN_CERT_PFX }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$WIN_CERT_PFX" | base64 -d > "$RUNNER_TEMP/cert.pfx"

          # 寻址 Windows SDK 下的 signtool.exe
          SIGNTOOL=$(find "/c/Program Files (x86)/Windows Kits/10/bin" -name signtool.exe 2>/dev/null | grep x64 | sort -V | tail -n 1 || true)
          if [ -z "$SIGNTOOL" ] || [ ! -f "$SIGNTOOL" ]; then
            SIGNTOOL="signtool"
          fi

          exe="feedback-v1/tools/desktop-sender/dist/极方每周反馈程序/极方每周反馈程序.exe"
          "$SIGNTOOL" sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 \
            /f "$RUNNER_TEMP/cert.pfx" /p "$WIN_CERT_PASSWORD" \
            /n "$WIN_CERT_NAME" "$exe"
          "$SIGNTOOL" verify /pa "$exe"

          exe_rs="feedback-v1/tools/desktop-sender/dist/极方每周反馈程序-Fluent-x64.exe"
          if [ -f "$exe_rs" ]; then
            "$SIGNTOOL" sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 \
              /f "$RUNNER_TEMP/cert.pfx" /p "$WIN_CERT_PASSWORD" \
              /n "$WIN_CERT_NAME" "$exe_rs"
            "$SIGNTOOL" verify /pa "$exe_rs"
          fi

          # 务必清除证书副本，避免泄漏到后续步骤或日志
          shred -u "$RUNNER_TEMP/cert.pfx" 2>/dev/null || rm -f "$RUNNER_TEMP/cert.pfx"

      - name: Extract version
        id: get_version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VER="${GITHUB_REF_NAME#tools-}"
          else
            VER="v2.0"
          fi
          echo "version=${VER}" >> $GITHUB_OUTPUT

      - name: Package as zip
        env:
          PYTHONIOENCODING: utf-8
        run: |
          VER="${{ steps.get_version.outputs.version }}"
          export VER
          # 用 Python 的 zipfile 而非 7z/bash zip：
          #   zipfile 会为非 ASCII 文件名正确置位 UTF-8 标志位(bit 11)，
          #   Windows 资源管理器解压中文名不会乱码；而 bash 管道 + 外部压缩工具
          #   在 Windows runner 上有编码不确定性（本仓库此前就踩过 Windows 编码坑）。
          python - <<'PY'
          import os, shutil, zipfile, sys
          if hasattr(sys.stdout, 'reconfigure'):
              sys.stdout.reconfigure(encoding='utf-8')

          DIST = "feedback-v1/tools/desktop-sender/dist"
          VER  = os.environ["VER"]

          folder = "极方每周反馈程序"
          root = os.path.join(DIST, folder)
          # 剔除 PyInstaller 中间产物，减小体积
          for junk in ("__pycache__", "build"):
              shutil.rmtree(os.path.join(root, junk), ignore_errors=True)

          exe = os.path.join(root, folder + ".exe")
          assert os.path.isfile(exe), f"未找到主程序: {exe}"

          out = os.path.join(DIST, f"极方每周反馈程序-{VER}.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for dirpath, _dirs, files in os.walk(root):
                  for f in files:
                      full = os.path.join(dirpath, f)
                      z.write(full, os.path.relpath(full, DIST))
          print(f"{out}  {os.path.getsize(out)/1048576:.1f} MB")
          PY

      - name: Report size
        run: |
          cd feedback-v1/tools/desktop-sender/dist
          echo "=== 压缩包（对比 onefile 时代单个 exe 91.5MB）==="
          ls -lh *.zip
          echo
          echo "=== onedir 内主程序体积（对比 onefile 时代 91.5MB）==="
          ls -lh "极方每周反馈程序"/*.exe
          echo
          echo "=== Rust Fluent 原生单文件 exe 体积 ==="
          ls -lh "极方每周反馈程序-Fluent-x64.exe"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/tools-')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: 极方每周反馈程序 ${{ steps.get_version.outputs.version }}
          body: |
            自动构建（${{ github.sha }}）。

            ## 📥 双版本下载指引

            本版本提供两套独立版本供教师选择使用：

            ### 选项 A（强烈推荐）：🚀 极方每周反馈程序 Fluent 现代版 (Rust 原生重构版)
            - **下载附件**：`极方每周反馈程序-Fluent-x64.exe`
            - **体积与形态**：单文件绿色版、约 10MB、无需解压、双击直接运行。
            - **全新交互**：Windows 11 Fluent 2.0 现代圆角视觉风格、侧边栏导航、☀️/🌙 深浅色一键切换。
            - **效率升级**：左侧一键快捷复制当前学生学号与姓名（如：12345，吴涛）、右侧一键复制完整反馈评语文案。
            - **历史台账**：全新历史发送档案中心，支持周次联动筛选、班级实时搜索、学生发送明细弹窗与 CSV 导出。
            - **安全与防误发**：采用 Windows 10/11 内置原生免模型 OCR + 云端大模型视觉双保险，彻底杜绝杀软误报。

            ### 选项 B：🛡 极方每周反馈程序 经典稳定版 (Python 目录式打包)
            - **下载附件**：`极方每周反馈程序-${{ steps.get_version.outputs.version }}.zip`
            - **体积与形态**：约 39MB 压缩包，**下载后必须完整解压到文件夹**后运行。
            - **交互特点**：经典熟识单窗体、离线 Paddle/ONNX OCR 引擎作为兼容托底。
          files: |
            feedback-v1/tools/desktop-sender/dist/极方每周反馈程序-*.zip
            feedback-v1/tools/desktop-sender/dist/极方每周反馈程序-Fluent-*.exe