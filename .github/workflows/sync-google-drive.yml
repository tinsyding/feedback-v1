name: Sync to Google Drive

# 代码变更自动同步到 Google Drive 备份目录
# 支持两种凭证（二选一，个人 Google One 会员推荐方式 1）：
#   方式 1（个人账号推荐）：
#     GDRIVE_RCLONE_CONFIG  个人授权生成的 rclone.conf 全文（直接使用您的会员存储空间）
#   方式 2（企业/团队盘）：
#     GDRIVE_SA_JSON        Google Cloud 服务账号 JSON 密钥
#     GDRIVE_FOLDER_ID      Google Drive 目标备份文件夹 ID

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/apply-nginx-hardening.yml'
  workflow_dispatch: # 支持在 GitHub 网页界面手动点击一键触发

concurrency:
  group: gdrive-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync code to Google Drive
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preflight check secrets
        env:
          GDRIVE_RCLONE_CONFIG: ${{ secrets.GDRIVE_RCLONE_CONFIG }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          if [ -n "$GDRIVE_RCLONE_CONFIG" ]; then
            echo "✅ 检测到个人 OAuth 授权配置 (GDRIVE_RCLONE_CONFIG)，将直接使用您的个人会员空间同步"
          elif [ -n "$GDRIVE_SA_JSON" ] && [ -n "$GDRIVE_FOLDER_ID" ]; then
            echo "✅ 检测到服务账号配置 (GDRIVE_SA_JSON)"
          else
            echo "❌ 缺少必要的 GitHub Secrets!"
            echo "个人会员账号请在仓库添加 Secret: GDRIVE_RCLONE_CONFIG"
            exit 1
          fi

      - name: Install rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone

      - name: Configure rclone for Google Drive
        env:
          GDRIVE_RCLONE_CONFIG: ${{ secrets.GDRIVE_RCLONE_CONFIG }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          mkdir -p ~/.config/rclone
          if [ -n "$GDRIVE_RCLONE_CONFIG" ]; then
            echo "$GDRIVE_RCLONE_CONFIG" > ~/.config/rclone/rclone.conf
          else
            echo "$GDRIVE_SA_JSON" > /tmp/gdrive_sa.json
            cat << EOF > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive
          service_account_file = /tmp/gdrive_sa.json
          root_folder_id = $GDRIVE_FOLDER_ID
          EOF
          fi

      - name: Sync code tree to Google Drive
        run: |
          echo "🚀 开始增量镜像同步代码至 Google Drive..."
          rclone sync . gdrive:latest \
            --exclude ".git/**" \
            --exclude ".github/**" \
            --exclude "node_modules/**" \
            --exclude "tmp/**" \
            --exclude ".commandcode/**" \
            --exclude "*.log" \
            --verbose \
            --fast-list

          echo "✅ 代码目录同步完成！"

      - name: Cleanup temporary credentials
        if: always()
        run: |
          rm -f /tmp/gdrive_sa.json
          rm -rf ~/.config/rclone
