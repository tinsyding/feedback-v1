name: Build sender_py (Windows)

# 推送 sender_py 相关改动到 main / feat/** 时：
#   1) 在 Linux 跑纯函数单测与 compileall；
#   2) 在 Windows 打包 Web 版普通压缩包 (--onedir) 与 Nuitka 单文件版 (--onefile) 并上传 Artifact。
# 推送 sender-* tag 时，发布普通压缩包与 Nuitka 单文件版到 GitHub Release（仅放 Web 版，Tk 版已停止维护）。
# 也可在 Actions 页面手动 Run workflow。
# 产物未签名，仅供内测/验证；正式分发前请做代码签名与杀软回归。

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/**'
    tags:
      - 'sender-*'
    paths:
      - 'feedback-v1/tools/sender_py/**'
      - '.github/workflows/build-sender.yml'
  pull_request:
    paths:
      - 'feedback-v1/tools/sender_py/**'
      - '.github/workflows/build-sender.yml'

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

concurrency:
  group: build-sender-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: feedback-v1/tools/sender_py/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r feedback-v1/tools/sender_py/requirements.txt

      - name: Compile Python
        run: python -m compileall -q feedback-v1/tools/sender_py

      - name: Unit tests
        working-directory: feedback-v1/tools
        run: python -m unittest discover -s sender_py/tests -v

  build-windows:
    name: Windows package
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: feedback-v1/tools/sender_py/requirements.txt

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r feedback-v1/tools/sender_py/requirements.txt
          python -m pip install pyinstaller nuitka zstandard

      - name: Inject sender token
        if: github.event_name != 'pull_request'
        env:
          SENDER_API_TOKEN: ${{ secrets.SENDER_API_TOKEN }}
        run: |
          if [ -z "$SENDER_API_TOKEN" ]; then
            echo "缺少 GitHub Secret SENDER_API_TOKEN，无法生成零配置发送端"
            exit 1
          fi
          python - <<'PY'
          import os
          token = os.environ["SENDER_API_TOKEN"]
          path = "feedback-v1/tools/sender_py/sender_token.py"
          with open(path, "w", encoding="utf-8") as f:
              f.write("# generated by CI; do not commit\n")
              f.write("SENDER_TOKEN = " + repr(token) + "\n")
          print("sender_token.py generated")
          PY

      - name: Verify embedded token
        if: github.event_name != 'pull_request'
        env:
          PYTHONPATH: ${{ github.workspace }}/feedback-v1/tools
          SENDER_API_TOKEN: ${{ secrets.SENDER_API_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from sender_py.vision_api import load_token
          assert load_token() == os.environ["SENDER_API_TOKEN"], "embedded token not loaded"
          print("embedded token verified")
          PY

      - name: Compile Python
        run: python -m compileall -q feedback-v1/tools/sender_py

      - name: Import smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}/feedback-v1/tools
        run: python -c "import sender_py.sender, sender_py.window_utils; print('imports OK')"

      - name: Web edition smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}/feedback-v1/tools
        run: python -m sender_py.web_main --smoke-test

      - name: Legacy Tkinter smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}/feedback-v1/tools
        run: |
          python - <<'PY'
          import tkinter as tk
          from sender_py.sender import SenderApp

          root = tk.Tk()
          root.withdraw()
          SenderApp(
              root,
              [{"sid": "90001", "sname": "测试", "studentName": "90001测试",
                "message": "测试话术"}],
              "https://feedback.wxjifang.cn",
              "测试 [第 1 周]",
          )
          root.update_idletasks()
          root.update()
          root.destroy()
          print("Tkinter smoke OK (legacy)")
          PY

      # ---- 普通压缩包版 (--onedir 文件夹模式，解压即用，防360拦截) ----
      - name: Build Windows Web Edition (--onedir, PyInstaller)
        env:
          PYTHONPATH: ${{ github.workspace }}/feedback-v1/tools
        run: |
          mkdir -p dist dist_dir

          # 确保 ICO 包含 16~256px 多尺寸高清位图
          python -c "from PIL import Image; im=Image.open('feedback-v1/favicon.ico'); img=im.copy(); im.close(); img.save('feedback-v1/favicon.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])" || true

          # 极方每周反馈程序 Web 文件夹版（普通压缩包版）
          python -m PyInstaller --noconfirm --clean --noupx --windowed --onedir \
            --distpath dist_dir \
            --name "JiFangFeedbackWeb" \
            --icon feedback-v1/favicon.ico \
            --version-file feedback-v1/tools/sender_py/version_info.txt \
            --add-data "feedback-v1/favicon.ico;." \
            --add-data "feedback-v1/favicon.ico;sender_py" \
            --add-data "feedback-v1/tools/example.png;." \
            --add-data "feedback-v1/tools/example.png;sender_py" \
            --add-data "feedback-v1/tools/sender_py/web_ui.html;sender_py" \
            --add-data "feedback-v1/tools/sender_py/web_ui.html;." \
            --paths feedback-v1/tools \
            --paths feedback-v1/tools/sender_py \
            --collect-submodules sender_py \
            --exclude-module sender_py.tests \
            --exclude-module unittest \
            --exclude-module test \
            --hidden-import sender_py.sender_token \
            --collect-all rapidocr_onnxruntime \
            feedback-v1/tools/sender_py/web_main.py
          mv dist_dir/JiFangFeedbackWeb/JiFangFeedbackWeb.exe "dist_dir/JiFangFeedbackWeb/极方每周反馈程序-Web版.exe"
          mv dist_dir/JiFangFeedbackWeb "dist_dir/极方每周反馈程序-Web版-绿色文件夹版"
          powershell -NoProfile -Command "Compress-Archive -Path 'dist_dir/极方每周反馈程序-Web版-绿色文件夹版' -DestinationPath 'dist/极方每周反馈程序-Web版-绿色文件夹版.zip' -Force"

      # ---- Nuitka 原生机器码单文件版 (--onefile 独立 exe，彻底免疫杀软误报) ----
      - name: Build Windows Web Edition (--onefile, Nuitka)
        env:
          PYTHONPATH: ${{ github.workspace }}/feedback-v1/tools
        run: |
          python feedback-v1/tools/sender_py/build_nuitka.py onefile --skip-deps
          cp "feedback-v1/tools/sender_py/dist_nuitka_onefile/极方每周反馈程序-Web版.exe" "dist/极方每周反馈程序-Web版-Nuitka单文件版.exe"
          cp "feedback-v1/tools/sender_py/dist_nuitka_onefile/JiFangFeedbackWeb.exe" "dist/JiFangFeedbackWeb-nuitka-onefile-windows-x64.exe"

      - name: Verify build output
        run: |
          test -f "dist/极方每周反馈程序-Web版-绿色文件夹版.zip"
          test -f "dist/极方每周反馈程序-Web版-Nuitka单文件版.exe"
          test -f "dist/JiFangFeedbackWeb-nuitka-onefile-windows-x64.exe"
          ls -lh dist/

      - name: Frozen exe smoke test
        run: |
          echo "Testing PyInstaller onedir package..."
          python -c "import subprocess, sys; p = subprocess.run(['dist_dir/极方每周反馈程序-Web版-绿色文件夹版/极方每周反馈程序-Web版.exe', '--smoke-test'], timeout=120); sys.exit(p.returncode)"
          echo "Testing Nuitka onefile executable..."
          python -c "import subprocess, sys; p = subprocess.run(['dist/JiFangFeedbackWeb-nuitka-onefile-windows-x64.exe', '--smoke-test'], timeout=120); sys.exit(p.returncode)"

      - name: Prepare ASCII release assets (tags only)
        if: startsWith(github.ref, 'refs/tags/sender-')
        run: |
          cp "dist/极方每周反馈程序-Web版-绿色文件夹版.zip" "dist/JiFangFeedbackWeb-onedir-windows-x64.zip"
          test -f "dist/JiFangFeedbackWeb-nuitka-onefile-windows-x64.exe"

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/sender-')
        uses: softprops/action-gh-release@v2
        with:
          name: 极方每周反馈程序 ${{ github.ref_name }}
          files: |
            dist/JiFangFeedbackWeb-onedir-windows-x64.zip
            dist/JiFangFeedbackWeb-nuitka-onefile-windows-x64.exe
          fail_on_unmatched_files: true
          body: |
            ### 附件说明 / Release Assets:
            - **`JiFangFeedbackWeb-nuitka-onefile-windows-x64.exe`**：Nuitka 原生 C++ 机器码单文件版（独立 exe 便携运行，彻底免疫杀软误报，推荐优先使用）
            - **`JiFangFeedbackWeb-onedir-windows-x64.zip`**：普通绿色解压文件夹版（解压后运行内含的 `极方每周反馈程序-Web版.exe`）

      - name: Upload Windows artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/sender-') }}
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: JiFangFeedbackWeb-windows-x64
          path: |
            dist/极方每周反馈程序-Web版-绿色文件夹版.zip
            dist/极方每周反馈程序-Web版-Nuitka单文件版.exe
            dist/JiFangFeedbackWeb-nuitka-onefile-windows-x64.exe
          retention-days: 7
          if-no-files-found: error
          retention-days: 7
          if-no-files-found: error
