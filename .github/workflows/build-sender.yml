name: Build sender_py (Windows)

# 推送 sender_py 相关改动到 main / feat/** 时：
#   1) 在 Linux 跑纯函数单测与 compileall；
#   2) 在 Windows 用 PyInstaller 打包单文件 exe（极方每周反馈程序.exe）并上传 Artifact。
# 推送 sender-* tag 时，会额外把 exe 发布到同名 GitHub Release。
# 也可在 Actions 页面手动 Run workflow。
# 产物未签名，仅供内测/验证；正式分发前请做代码签名与杀软回归。

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/**'
    tags:
      - 'sender-*'
    paths:
      - 'feedback-v1/tools/sender_py/**'
      - '.github/workflows/build-sender.yml'
  pull_request:
    paths:
      - 'feedback-v1/tools/sender_py/**'
      - '.github/workflows/build-sender.yml'

permissions:
  contents: read

concurrency:
  group: build-sender-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: feedback-v1/tools/sender_py/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r feedback-v1/tools/sender_py/requirements.txt

      - name: Compile Python
        run: python -m compileall -q feedback-v1/tools/sender_py

      - name: Unit tests
        working-directory: feedback-v1/tools
        run: python -m unittest discover -s sender_py/tests -v

  build-windows:
    name: Windows package
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: feedback-v1/tools/sender_py/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r feedback-v1/tools/sender_py/requirements.txt
          python -m pip install pyinstaller nuitka zstandard

      - name: Inject sender token
        if: github.event_name != 'pull_request'
        env:
          SENDER_API_TOKEN: ${{ secrets.SENDER_API_TOKEN }}
        run: |
          if [ -z "$SENDER_API_TOKEN" ]; then
            echo "缺少 GitHub Secret SENDER_API_TOKEN，无法生成零配置发送端"
            exit 1
          fi
          python - <<'PY'
          import os
          token = os.environ["SENDER_API_TOKEN"]
          path = "feedback-v1/tools/sender_py/sender_token.py"
          with open(path, "w", encoding="utf-8") as f:
              f.write("# generated by CI; do not commit\n")
              f.write("SENDER_TOKEN = " + repr(token) + "\n")
          print("sender_token.py generated")
          PY

      - name: Compile Python
        run: python -m compileall -q feedback-v1/tools/sender_py

      - name: Import smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}/feedback-v1/tools
        run: python -c "import sender_py.sender, sender_py.window_utils; print('imports OK')"

      - name: UI smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}/feedback-v1/tools
        run: |
          python - <<'PY'
          import tkinter as tk
          from sender_py.sender import SenderApp

          root = tk.Tk()
          root.withdraw()
          SenderApp(
              root,
              [{"sid": "90001", "sname": "测试", "studentName": "90001测试",
                "message": "测试话术"}],
              "https://feedback.wxjifang.cn",
              "测试 [第 1 周]",
          )
          root.update_idletasks()
          root.update()
          root.destroy()
          print("UI smoke OK")
          PY

      # ---- 1. PyInstaller 单文件模式 (--onefile) ----
      - name: Build Windows executable (Tkinter Onefile)
        env:
          PYTHONPATH: ${{ github.workspace }}/feedback-v1/tools
        run: |
          python -m PyInstaller --noconfirm --clean --noupx --windowed --onefile \
            --name JiFangFeedbackSender \
            --icon feedback-v1/favicon.ico \
            --version-file feedback-v1/tools/sender_py/version_info.txt \
            --add-data "feedback-v1/favicon.ico;." \
            --add-data "feedback-v1/tools/example.png;." \
            --paths feedback-v1/tools \
            --paths feedback-v1/tools/sender_py \
            --collect-submodules sender_py \
            --hidden-import sender_py.sender_token \
            --collect-all sv_ttk \
            feedback-v1/tools/sender_py/sender.py
          mv dist/JiFangFeedbackSender.exe "dist/极方每周反馈程序.exe"

      - name: Build Windows executable (Web Onefile)
        env:
          PYTHONPATH: ${{ github.workspace }}/feedback-v1/tools
        run: |
          python -m PyInstaller --noconfirm --clean --noupx --windowed --onefile \
            --name JiFangFeedbackWeb \
            --icon feedback-v1/favicon.ico \
            --version-file feedback-v1/tools/sender_py/version_info.txt \
            --add-data "feedback-v1/favicon.ico;." \
            --add-data "feedback-v1/tools/example.png;." \
            --add-data "feedback-v1/tools/sender_py/web_ui.html;sender_py" \
            --paths feedback-v1/tools \
            --paths feedback-v1/tools/sender_py \
            --collect-submodules sender_py \
            --hidden-import sender_py.sender_token \
            feedback-v1/tools/sender_py/web_main.py
          mv dist/JiFangFeedbackWeb.exe "dist/极方每周反馈程序-Web版.exe"

      # ---- 2. 文件夹模式 (--onedir，解压即用，防360拦截首选) ----
      - name: Build Windows Folder Editions (--onedir)
        env:
          PYTHONPATH: ${{ github.workspace }}/feedback-v1/tools
        run: |
          mkdir -p dist_dir
          # 2.1 Tkinter 文件夹版
          python -m PyInstaller --noconfirm --clean --noupx --windowed --onedir \
            --distpath dist_dir \
            --name "JiFangFeedbackSender" \
            --icon feedback-v1/favicon.ico \
            --version-file feedback-v1/tools/sender_py/version_info.txt \
            --add-data "feedback-v1/favicon.ico;." \
            --add-data "feedback-v1/tools/example.png;." \
            --paths feedback-v1/tools \
            --paths feedback-v1/tools/sender_py \
            --collect-submodules sender_py \
            --hidden-import sender_py.sender_token \
            --collect-all sv_ttk \
            feedback-v1/tools/sender_py/sender.py
          mv dist_dir/JiFangFeedbackSender/JiFangFeedbackSender.exe "dist_dir/JiFangFeedbackSender/极方每周反馈程序.exe"
          mv dist_dir/JiFangFeedbackSender "dist_dir/极方每周反馈程序-绿色文件夹版"
          powershell -NoProfile -Command "Compress-Archive -Path 'dist_dir/极方每周反馈程序-绿色文件夹版' -DestinationPath 'dist/极方每周反馈程序-绿色文件夹版.zip' -Force"

          # 2.2 Web 文件夹版
          python -m PyInstaller --noconfirm --clean --noupx --windowed --onedir \
            --distpath dist_dir \
            --name "JiFangFeedbackWeb" \
            --icon feedback-v1/favicon.ico \
            --version-file feedback-v1/tools/sender_py/version_info.txt \
            --add-data "feedback-v1/favicon.ico;." \
            --add-data "feedback-v1/tools/example.png;." \
            --add-data "feedback-v1/tools/sender_py/web_ui.html;sender_py" \
            --paths feedback-v1/tools \
            --paths feedback-v1/tools/sender_py \
            --collect-submodules sender_py \
            --hidden-import sender_py.sender_token \
            feedback-v1/tools/sender_py/web_main.py
          mv dist_dir/JiFangFeedbackWeb/JiFangFeedbackWeb.exe "dist_dir/JiFangFeedbackWeb/极方每周反馈程序-Web版.exe"
          mv dist_dir/JiFangFeedbackWeb "dist_dir/极方每周反馈程序-Web版-绿色文件夹版"
          powershell -NoProfile -Command "Compress-Archive -Path 'dist_dir/极方每周反馈程序-Web版-绿色文件夹版' -DestinationPath 'dist/极方每周反馈程序-Web版-绿色文件夹版.zip' -Force"

      # ---- 3. Nuitka 原生机器码编译模式 (原生C++编译，彻底免杀) ----
      - name: Build Windows Nuitka Editions
        env:
          PYTHONPATH: ${{ github.workspace }}/feedback-v1/tools
        run: |
          # 3.1 Web 版 Nuitka 编译
          python -m nuitka --standalone --assume-yes-for-downloads --windows-console-mode=disable \
            --windows-icon-from-ico=feedback-v1/favicon.ico \
            --windows-company-name="极方教学" \
            --windows-product-name="极方每周反馈程序-Web版" \
            --windows-file-version="1.8.7.0" \
            --windows-product-version="1.8.7.0" \
            --windows-file-description="极方企业微信作业反馈发送器-Web版" \
            --include-package=sender_py \
            --include-module=sender_py.sender_token \
            --include-data-files="feedback-v1/favicon.ico=favicon.ico" \
            --include-data-files="feedback-v1/tools/example.png=example.png" \
            --include-data-files="feedback-v1/tools/sender_py/web_ui.html=sender_py/web_ui.html" \
            --output-dir=dist_nuitka_web \
            --output-filename="极方每周反馈程序-Web版.exe" \
            feedback-v1/tools/sender_py/web_main.py
          mv dist_nuitka_web/web_main.dist "dist_nuitka_web/极方每周反馈程序-Web版-Nuitka原生版"
          powershell -NoProfile -Command "Compress-Archive -Path 'dist_nuitka_web/极方每周反馈程序-Web版-Nuitka原生版' -DestinationPath 'dist/极方每周反馈程序-Web版-Nuitka原生版.zip' -Force"

          # 3.2 Tkinter 版 Nuitka 编译
          python -m nuitka --standalone --assume-yes-for-downloads --windows-console-mode=disable \
            --windows-icon-from-ico=feedback-v1/favicon.ico \
            --windows-company-name="极方教学" \
            --windows-product-name="极方每周反馈程序" \
            --windows-file-version="1.8.7.0" \
            --windows-product-version="1.8.7.0" \
            --windows-file-description="极方企业微信作业反馈发送器" \
            --enable-plugin=tk-inter \
            --include-package-data=sv_ttk \
            --include-package=sender_py \
            --include-module=sender_py.sender_token \
            --include-data-files="feedback-v1/favicon.ico=favicon.ico" \
            --include-data-files="feedback-v1/tools/example.png=example.png" \
            --output-dir=dist_nuitka \
            --output-filename="极方每周反馈程序.exe" \
            feedback-v1/tools/sender_py/sender.py
          mv dist_nuitka/sender.dist "dist_nuitka/极方每周反馈程序-Nuitka原生版"
          powershell -NoProfile -Command "Compress-Archive -Path 'dist_nuitka/极方每周反馈程序-Nuitka原生版' -DestinationPath 'dist/极方每周反馈程序-Nuitka原生版.zip' -Force"

      - name: Verify build output
        run: |
          test -f "dist/极方每周反馈程序.exe"
          test -f "dist/极方每周反馈程序-Web版.exe"
          test -f "dist/极方每周反馈程序-绿色文件夹版.zip"
          test -f "dist/极方每周反馈程序-Web版-绿色文件夹版.zip"
          test -f "dist/极方每周反馈程序-Nuitka原生版.zip"
          test -f "dist/极方每周反馈程序-Web版-Nuitka原生版.zip"
          ls -lh dist/

      - name: Frozen exe smoke test
        run: |
          # 1. 单文件冒烟验证
          python -c "import subprocess, sys; p = subprocess.run(['dist/极方每周反馈程序.exe', '--smoke-test'], timeout=120); sys.exit(p.returncode)"
          python -c "import subprocess, sys; p = subprocess.run(['dist/极方每周反馈程序-Web版.exe', '--smoke-test'], timeout=120); sys.exit(p.returncode)"
          # 2. 文件夹版冒烟验证
          python -c "import subprocess, sys; p = subprocess.run(['dist_dir/极方每周反馈程序-绿色文件夹版/极方每周反馈程序.exe', '--smoke-test'], timeout=120); sys.exit(p.returncode)"
          python -c "import subprocess, sys; p = subprocess.run(['dist_dir/极方每周反馈程序-Web版-绿色文件夹版/极方每周反馈程序-Web版.exe', '--smoke-test'], timeout=120); sys.exit(p.returncode)"
          # 3. Nuitka 编译版冒烟验证
          python -c "import subprocess, sys; p = subprocess.run(['dist_nuitka/极方每周反馈程序-Nuitka原生版/极方每周反馈程序.exe', '--smoke-test'], timeout=120); sys.exit(p.returncode)"
          python -c "import subprocess, sys; p = subprocess.run(['dist_nuitka_web/极方每周反馈程序-Web版-Nuitka原生版/极方每周反馈程序-Web版.exe', '--smoke-test'], timeout=120); sys.exit(p.returncode)"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v5
        with:
          name: JiFangFeedbackSender-windows-x64
          path: |
            dist/极方每周反馈程序.exe
            dist/极方每周反馈程序-Web版.exe
            dist/极方每周反馈程序-绿色文件夹版.zip
            dist/极方每周反馈程序-Web版-绿色文件夹版.zip
            dist/极方每周反馈程序-Nuitka原生版.zip
            dist/极方每周反馈程序-Web版-Nuitka原生版.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/sender-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: JiFangFeedbackSender-windows-x64
          path: dist

      - name: Resolve release title
        id: release_meta
        run: echo "title=极方每周反馈程序 ${GITHUB_REF_NAME#sender-}" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        run: |
          python - <<'PY'
          import shutil

          # 单文件 exe
          shutil.copyfile("dist/极方每周反馈程序.exe", "dist/JiFangFeedbackSender-windows-x64.exe")
          shutil.copyfile("dist/极方每周反馈程序-Web版.exe", "dist/JiFangFeedbackWeb-windows-x64.exe")

          # 文件夹绿色版 zip
          shutil.copyfile("dist/极方每周反馈程序-绿色文件夹版.zip", "dist/JiFangFeedbackSender-onedir-windows-x64.zip")
          shutil.copyfile("dist/极方每周反馈程序-Web版-绿色文件夹版.zip", "dist/JiFangFeedbackWeb-onedir-windows-x64.zip")

          # Nuitka 原生编译版 zip
          shutil.copyfile("dist/极方每周反馈程序-Nuitka原生版.zip", "dist/JiFangFeedbackSender-nuitka-windows-x64.zip")
          shutil.copyfile("dist/极方每周反馈程序-Web版-Nuitka原生版.zip", "dist/JiFangFeedbackWeb-nuitka-windows-x64.zip")
          PY

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release_meta.outputs.title }}
          files: |
            dist/JiFangFeedbackSender-windows-x64.exe
            dist/JiFangFeedbackWeb-windows-x64.exe
            dist/JiFangFeedbackSender-onedir-windows-x64.zip
            dist/JiFangFeedbackWeb-onedir-windows-x64.zip
            dist/JiFangFeedbackSender-nuitka-windows-x64.zip
            dist/JiFangFeedbackWeb-nuitka-windows-x64.zip
            dist/极方每周反馈程序-绿色文件夹版.zip
            dist/极方每周反馈程序-Web版-绿色文件夹版.zip
            dist/极方每周反馈程序-Nuitka原生版.zip
            dist/极方每周反馈程序-Web版-Nuitka原生版.zip
          fail_on_unmatched_files: true
          body: ""
